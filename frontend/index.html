<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness Optimization Engine · Verizon</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23EE0000'/><path d='M9 16l5 5 9-11' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <div class="shell">
    <nav class="nav" aria-label="Main">
      <div class="brand">
        <img class="logo" src="/static/verizon-logo.png" alt="Verizon">
        <div class="product">Harness Optimization Engine</div>
      </div>
      <ul id="nav"></ul>
      <div class="nav-foot">
        <div>Verizon · AI Agent Platform</div>
        <div id="llm-state" class="small"></div>
        <button id="reset" title="Re-seed all demo data">Reset demo data</button>
      </div>
    </nav>
    <div>
      <nav class="topbar" aria-label="Sections">
        <ul id="topnav"></ul>
        <div id="compare-toggle" class="compare-toggle" role="group" aria-label="Compare mode"></div>
      </nav>
      <header class="top">
        <div class="crumbs" id="crumbs"></div>
        <div class="agent-pick">
          <label for="agent">Agent</label>
          <select id="agent"></select>
          <span class="env-tag">Production</span>
        </div>
      </header>
      <section id="startup-health" class="startup-health" aria-live="polite"></section>
      <main id="main" tabindex="-1"><div class="loading">Starting the engine…</div></main>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
